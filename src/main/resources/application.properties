spring.application.name=parcialPromocion
spring.config.import=optional:file:.env[.properties]
# Puerto en el que escucha el servidor web (http://localhost:8080)
server.port=8080

# Base de datos (variables de entorno leídas desde el archivo .env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Habilita la consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
# Flyway administra el esquema de la base de datos
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
